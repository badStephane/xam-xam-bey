# CI : bloque chaque push et chaque pull request sur main si les types, les tests, le build,
# le contenu de révision, les tests de base (RLS) ou les E2E Playwright échouent. Ne déploie rien : la production
# (Cloudflare Pages, envoi direct) part de `npm run deploy:pages` depuis un main propre (docs/squad/06-ops.md §B).
# Versions des actions vérifiées le 2026-10-13 (releases GitHub, runs.using de action.yml) : toutes tournent sous Node 24.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: build (valeurs factices, aucun secret)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_ANON_KEY: ci-anon-key
      - name: dist complet
        run: test -f dist/index.html && test -f dist/_headers
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: contenu de révision (data/seed)
        run: python3 scripts/check_content.py

  # Base ET E2E dans un seul job : une seule `supabase start` (téléchargement des images, ~2 min) et un seul
  # `npm ci` par exécution. Dépôt privé en offre gratuite : chaque job est facturé à la minute entamée.
  db:
    name: db + e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Node d'abord : setup-cli v3 installe la CLI depuis npm avec le Node déjà présent dans le job.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          # 2.120.0 depuis le lot 4 (05-build, « Lot 4 > SRE ») : `start`, `db reset`, `test db` (93 tests), parité et
          # E2E complet (46/46, Mailpit 55324) verts en local le 2026-10-13. `auto_expose_new_tables` reste non défini
          # (défaut : pas d'exposition implicite), 04_lot2_test.sql passe ; toute nouvelle table devra porter ses GRANT.
          version: 2.120.0
      # inbucket = Mailpit (port 55324) : l'E2E y lit le code à 6 chiffres. Modèles d'e-mail : supabase/templates/.
      - name: base locale (services utiles aux tests seulement)
        run: supabase start -x analytics,edge-runtime,functions,imgproxy,meta,realtime,studio,vector
      - name: tests pgTAP (RLS, fonctions)
        run: supabase test db
      - run: npm ci
      - name: test de parité save_progress / mergeProgress (base locale, psql du runner)
        run: psql --version && npx vitest run src/lib/progressParity.test.ts
        env:
          # base locale jetable de `supabase start` (port [db] de supabase/config.toml), pas un secret
          XXB_PARITY_DB_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
      - name: navigateur Playwright (Chromium et ses dépendances système)
        run: npx playwright install --with-deps chromium
      - name: E2E (vite local sur la pile locale, jamais la production)
        run: npm run e2e -- --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: arrêt
        if: always()
        run: supabase stop --no-backup
